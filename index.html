<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NUE - Canggu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
  <style>
    body { margin: 0; background: #0A3D2B; overflow: hidden; }
  </style>
</head>
<body>

  <script>
    const Engine = Matter.Engine;
    const Render = Matter.Render;
    const World = Matter.World;
    const Bodies = Matter.Bodies;
    const Body = Matter.Body;
    const Mouse = Matter.Mouse;
    const MouseConstraint = Matter.MouseConstraint;

    const engine = Engine.create();
    engine.gravity.y = 2.4;

    const render = Render.create({
      element: document.body,
      engine: engine,
      options: {
        width: window.innerWidth,
        height: window.innerHeight,
        wireframes: false,
        background: '#0A3D2B'
      }
    });

    // Ground
    const ground = Bodies.rectangle(window.innerWidth/2, window.innerHeight - 80, window.innerWidth*2, 160, {
      isStatic: true,
      render: { visible: false }
    });
    World.add(engine.world, ground);

    // First logo
    const logo1 = Bodies.rectangle(window.innerWidth * 0.35, 120, 380, 150, {
      restitution: 0.52,
      friction: 0.35,
      render: {
        sprite: {
          texture: 'nue-logo.png',
          xScale: 0.9,
          yScale: 0.9
        }
      }
    });

    // Second logo
    const logo2 = Bodies.rectangle(window.innerWidth * 0.65, 80, 380, 150, {
      restitution: 0.52,
      friction: 0.35,
      render: {
        sprite: {
          texture: 'nue-logo-copy.png',
          xScale: 0.9,
          yScale: 0.9
        }
      }
    });

    World.add(engine.world, [logo1, logo2]);

    // Mouse drag
    const mouse = Mouse.create(render.canvas);
    const mouseConstraint = MouseConstraint.create(engine, { mouse: mouse });
    World.add(engine.world, mouseConstraint);

    Engine.run(engine);
    Render.run(render);

    // Click = Push whichever logo is closest to click position
    document.addEventListener('click', (e) => {
      const clickX = e.clientX;
      const clickY = e.clientY;

      const bodies = [logo1, logo2];
      let closest = logo1;
      let minDist = Infinity;

      bodies.forEach(body => {
        const dx = body.position.x - clickX;
        const dy = body.position.y - clickY;
        const dist = dx*dx + dy*dy;
        if (dist < minDist) {
          minDist = dist;
          closest = body;
        }
      });

      // Push the closest logo
      Body.applyForce(closest, closest.position, {
        x: (Math.random() - 0.5) * 0.12,
        y: -0.18
      });

      Body.setAngularVelocity(closest, (Math.random() - 0.5) * 0.3);
    });
  </script>
</body>
</html>
