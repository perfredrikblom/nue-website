<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NUE - Canggu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
  <style>
    body { margin: 0; background: #0A3D2B; overflow: hidden; }
  </style>
</head>
<body>

  <script>
    const Engine = Matter.Engine;
    const Render = Matter.Render;
    const World = Matter.World;
    const Bodies = Matter.Bodies;
    const Body = Matter.Body;
    const Mouse = Matter.Mouse;
    const MouseConstraint = Matter.MouseConstraint;

    const engine = Engine.create();
    engine.gravity.y = 2.4;

    const render = Render.create({
      element: document.body,
      engine: engine,
      options: {
        width: window.innerWidth,
        height: window.innerHeight,
        wireframes: false,
        background: '#0A3D2B'
      }
    });

    // Ground
    const ground = Bodies.rectangle(window.innerWidth/2, window.innerHeight - 80, window.innerWidth*2, 160, {
      isStatic: true,
      render: { visible: false }
    });
    World.add(engine.world, ground);

    // Logo
    const logoBody = Bodies.rectangle(window.innerWidth/2, 150, 420, 160, {
      restitution: 0.52,
      friction: 0.35,
      render: {
        sprite: {
          texture: 'nue-logo.png',
          xScale: 0.95,
          yScale: 0.95
        }
      }
    });

    World.add(engine.world, logoBody);

    // Mouse drag support
    const mouse = Mouse.create(render.canvas);
    const mouseConstraint = MouseConstraint.create(engine, { mouse: mouse });
    World.add(engine.world, mouseConstraint);

    Engine.run(engine);
    Render.run(render);

    // CLICK = Push from current position (no reset)
    document.addEventListener('click', (e) => {
      const forceMagnitude = 0.08;
      const dx = (Math.random() - 0.5) * 12;   // random horizontal push
      const dy = -14;                          // upward push

      Body.applyForce(logoBody, logoBody.position, {
        x: dx * forceMagnitude,
        y: dy * forceMagnitude
      });

      // Add some spin for fun
      Body.setAngularVelocity(logoBody, (Math.random() - 0.5) * 0.25);
    });
  </script>
</body>
</html>
