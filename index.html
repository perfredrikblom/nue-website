<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NUE - Canggu</title>
  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
  <style>
    body { 
      margin: 0; 
      background: #0A3D2B; 
      overflow: hidden; 
      font-family: system-ui, sans-serif; 
    }

    .physics-button {
      position: absolute;
      background: transparent;
      border: none;
      color: #D4A373;
      cursor: pointer;
      padding: 0;
      z-index: 100;
      transition: color 0.2s;
    }
    .physics-button:hover {
      color: white;
    }

    /* Unique styles for each button */
    #btn-reserve { 
      font-size: 1.45rem; 
      font-weight: 700; 
      letter-spacing: -0.02em;
    }
    #btn-menu { 
      font-size: 1.15rem; 
      font-weight: 400; 
      font-style: italic;
    }
    #btn-about { 
      font-size: 1.35rem; 
      font-weight: 600; 
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    #btn-contact { 
      font-size: 1.05rem; 
      font-weight: 500; 
      letter-spacing: 0.12em;
    }
  </style>
</head>
<body>
  <script src="script.js"></script>
</body>
</html>
