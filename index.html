<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NUE - Canggu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; }
    #physics-container { 
      width: 100%; 
      max-width: 720px; 
      height: 420px; 
      margin: 0 auto; 
      background: rgba(10, 61, 43, 0.65); 
      border-radius: 28px;
      overflow: hidden;
    }
  </style>
</head>
<body class="bg-[#0A3D2B] text-white min-h-screen">

  <div class="min-h-screen flex flex-col items-center justify-center p-6">
    <div class="mb-8 text-center">
      <p class="text-[#D4A373] text-xl">Modern Tropical Cuisine • Canggu, Bali</p>
    </div>

    <div id="physics-container"></div>

    <div class="flex flex-col sm:flex-row gap-4 mt-12">
      <a href="https://octotable.com/book/restaurant/1000969/booking/new" target="_blank"
         class="bg-white text-black px-10 py-4 rounded-full text-lg font-medium hover:bg-[#D4A373]">
        Reserve a Table
      </a>
      <a href="#menu" class="border border-white/70 px-10 py-4 rounded-full text-lg font-medium hover:bg-white/10">
        View Menu
      </a>
    </div>
  </div>

  <script>
    const Engine = Matter.Engine;
    const Render = Matter.Render;
    const World = Matter.World;
    const Bodies = Matter.Bodies;
    const Body = Matter.Body;
    const MouseConstraint = Matter.MouseConstraint;
    const Mouse = Matter.Mouse;

    const engine = Engine.create();
    engine.gravity.y = 1.7;

    const render = Render.create({
      element: document.getElementById('physics-container'),
      engine: engine,
      options: { width: 720, height: 420, wireframes: false, background: 'transparent' }
    });

    // Boundaries
    World.add(engine.world, [
      Bodies.rectangle(360, 400, 1000, 60, { isStatic: true, render: { visible: false } }),
      Bodies.rectangle(-30, 210, 60, 500, { isStatic: true, render: { visible: false } }),
      Bodies.rectangle(750, 210, 60, 500, { isStatic: true, render: { visible: false } })
    ]);

    // Create bodies (still rectangles for physics, but we'll overlay your SVG shapes)
    const nBody = Bodies.rectangle(200, 120, 110, 160, { restitution: 0.6, friction: 0.2, render: { fillStyle: 'transparent' } });
    const uBody = Bodies.rectangle(340, 120, 100, 160, { restitution: 0.65, friction: 0.2, render: { fillStyle: 'transparent' } });
    const eBody = Bodies.rectangle(480, 120, 110, 160, { restitution: 0.6, friction: 0.2, render: { fillStyle: 'transparent' } });

    World.add(engine.world, [nBody, uBody, eBody]);

    // Add your actual SVG letters on top (no boxes)
    function createLetterSVG(body, svgPathData, offsetX, offsetY) {
      const div = document.createElement('div');
      div.style.position = 'absolute';
      div.style.width = '120px';
      div.style.height = '180px';
      div.innerHTML = `
        <svg width="120" height="180" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
          <path fill="#262626" d="${svgPathData}"/>
        </svg>`;
      document.getElementById('physics-container').appendChild(div);

      Matter.Events.on(engine, 'afterUpdate', () => {
        const pos = body.position;
        const angle = body.angle * (180 / Math.PI);
        div.style.left = `${pos.x - 60 + offsetX}px`;
        div.style.top = `${pos.y - 90 + offsetY}px`;
        div.style.transform = `rotate(${angle}deg)`;
      });
    }

    // Paste your path data here (I extracted the main ones)
    createLetterSVG(nBody, "m28.19,190.98c-2.92.74-6.1-1.91-6.78-8.9-.79-10.57,3.01-21.13,8.12-29.73,6.77-11.76,17.83-22.87,31.75-22.59,10.33.15,19.41,7.71,23.54,17.38,4.05,9.21,2.96,20.1.07,29.27-1.75,5.73-4.16,11.15-6.88,16.41-.17.36-.56,1.03-1,.81s-.18-.97-.02-1.33l.43-1.09c4.88-12.98,9.43-28.64,3-41.81-2.54-4.92-6.61-9.15-11.58-11.22-11.17-4.58-21.35,4.31-27.64,13.68-4.54,6.76-7.99,13.1-9.59,20.6-.76,3.31-1.12,8.46-.64,11.79.85,5.77-2.8,6.72-2.8,6.72,0,0,2.2-.56,0,0Z", -10, 10); // N

    createLetterSVG(uBody, "m108.94,121.33c1.49,2.82,3.92,7.45,5.7,10.6,4.26,7.58,8.85,14.98,13.98,22,4.08,5.79,10.49,13.45,17.71,12.72,10-1.23,17.91-13.4,22.9-21.58,5.99-10.02,11.05-20.75,16.41-31.31,0,0,.12-.32.47-.2.31.11.17.47.17.47-6.68,18.93-21.92,70.16-49.8,57.74-6.11-2.98-10.27-7.86-14.26-13.04-5.54-7.15-10.48-14.8-14.96-22.63-1.85-3.24-3.64-6.57-5.39-9.86-1.59-2.99-2.16-6.39.85-7.78,2.47-1.14,4.71.04,6.21,2.86Z", -5, 5); // U (main part)

    createLetterSVG(eBody, "m270,165.17c-2.58-2.68-5.4-5.35-8.55-7.3-6.11-4.15-13.29-5.13-20.08-2.61-6.7,2.25-10.79,8.89-11.15,16.04-.17,3.55.52,7.19,2.39,10.19,3.38,5.06,9.4,8.14,15.41,8.51,10.48.78,20.08-5.99,25.1-15.25.28-.51.95-.16.7.32-3.96,10.72-14.38,18.63-25.91,18.62-7.36.03-14.93-3.3-19.39-9.38-4.42-6.4-4.96-14.96-2.27-22.17,5.93-15.89,25.87-19.28,39.09-10.55,3.7,2.42,7.26,5.02,10,8.44,3.34,4.17-1.88,8.76-5.34,5.16Z", 0, 0); // E

    // Mouse / Touch drag
    const mouse = Mouse.create(render.canvas);
    const mouseConstraint = MouseConstraint.create(engine, { mouse: mouse, constraint: { stiffness: 0.85 }});
    World.add(engine.world, mouseConstraint);

    Engine.run(engine);
    Render.run(render);

    // Reset
    render.canvas.addEventListener('dblclick', () => {
      [nBody, uBody, eBody].forEach(b => {
        Body.setPosition(b, { x: 150 + Math.random()*420, y: 60 });
        Body.setVelocity(b, { x: (Math.random()-0.5)*12, y: -15 });
      });
    });
  </script>
</body>
</html>
