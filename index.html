<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NUE - Canggu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
  <style>
    body { margin: 0; background: #0A3D2B; overflow: hidden; }
    #container { position: relative; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <div id="container"></div>

  <script>
    const Engine = Matter.Engine;
    const Render = Matter.Render;
    const World = Matter.World;
    const Bodies = Matter.Bodies;
    const Body = Matter.Body;
    const MouseConstraint = Matter.MouseConstraint;
    const Mouse = Matter.Mouse;

    const engine = Engine.create();
    engine.gravity.y = 2.4;

    const render = Render.create({
      element: document.getElementById('container'),
      engine: engine,
      options: {
        width: window.innerWidth,
        height: window.innerHeight,
        wireframes: false,
        background: '#0A3D2B'
      }
    });

    // Ground
    const ground = Bodies.rectangle(window.innerWidth/2, window.innerHeight - 80, window.innerWidth * 2, 160, {
      isStatic: true,
      render: { visible: false }
    });

    World.add(engine.world, ground);

    // Individual letter bodies (approximated for physics)
    const letters = [];
    const positions = [
      {x: window.innerWidth * 0.32, y: 120, w: 110, h: 160, text: 'N'},
      {x: window.innerWidth * 0.5, y: 100, w: 100, h: 160, text: 'U'},
      {x: window.innerWidth * 0.68, y: 130, w: 110, h: 160, text: 'E'}
    ];

    positions.forEach(p => {
      const body = Bodies.rectangle(p.x, p.y, p.w, p.h, {
        restitution: 0.55,
        friction: 0.3,
        chamfer: { radius: 12 }
      });
      letters.push(body);
      World.add(engine.world, body);
    });

    // Mouse drag
    const mouse = Mouse.create(render.canvas);
    const mouseConstraint = MouseConstraint.create(engine, { mouse: mouse });
    World.add(engine.world, mouseConstraint);

    Engine.run(engine);
    Render.run(render);

    // Click to reset
    document.addEventListener('click', () => {
      letters.forEach((letter, i) => {
        Body.setPosition(letter, { 
          x: window.innerWidth * (0.3 + i * 0.2), 
          y: 80 + Math.random() * 60 
        });
        Body.setVelocity(letter, { 
          x: (Math.random() - 0.5) * 12, 
          y: -18 
        });
      });
    });
  </script>
</body>
</html>
