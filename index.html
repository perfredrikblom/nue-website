  <script>
    const Engine = Matter.Engine;
    const Render = Matter.Render;
    const World = Matter.World;
    const Bodies = Matter.Bodies;
    const Body = Matter.Body;
    const Mouse = Matter.Mouse;
    const MouseConstraint = Matter.MouseConstraint;

    const engine = Engine.create();
    engine.gravity.y = 2.8;

    const render = Render.create({
      element: document.body,
      engine: engine,
      options: {
        width: window.innerWidth,
        height: window.innerHeight,
        wireframes: false,
        background: 'transparent'
      }
    });

    // Bottom ground
    const ground = Bodies.rectangle(window.innerWidth/2, window.innerHeight - 60, window.innerWidth*2, 120, {
      isStatic: true,
      render: { visible: false }
    });

    World.add(engine.world, ground);

    // Logo physics body
    const logoContainer = document.getElementById('logo-container');
    const logoBody = Bodies.rectangle(
      window.innerWidth / 2,
      100,
      420,
      160,
      {
        restitution: 0.48,   // Bounce amount
        friction: 0.4,
        render: { visible: false }
      }
    );

    World.add(engine.world, logoBody);

    // Sync visual logo with physics
