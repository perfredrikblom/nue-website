<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NUE - Canggu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
  <style>
    body { margin: 0; background: #0A3D2B; overflow: hidden; }
  </style>
</head>
<body>

  <script>
    const Engine = Matter.Engine;
    const Render = Matter.Render;
    const World = Matter.World;
    const Bodies = Matter.Bodies;
    const Body = Matter.Body;
    const Mouse = Matter.Mouse;
    const MouseConstraint = Matter.MouseConstraint;

    const engine = Engine.create();
    engine.gravity.y = 1.8;        // More natural speed

    const render = Render.create({
      element: document.body,
      engine: engine,
      options: {
        width: window.innerWidth,
        height: window.innerHeight,
        wireframes: false,
        background: '#0A3D2B'
      }
    });

    // Ground — exactly at bottom of window
    const ground = Bodies.rectangle(
      window.innerWidth / 2, 
      window.innerHeight - 25, 
      window.innerWidth * 2, 
      80, 
      { 
        isStatic: true,
        restitution: 0.75,      // Stronger bounce
        render: { visible: false }
      }
    );
    World.add(engine.world, ground);

    // Logo
    const logoBody = Bodies.rectangle(window.innerWidth / 2, 120, 420, 160, {
      restitution: 0.72,
      friction: 0.3,
      render: {
        sprite: {
          texture: 'nue-logo.png',
          xScale: 0.9,
          yScale: 0.9
        }
      }
    });

    World.add(engine.world, logoBody);

    // Mouse drag
    const mouse = Mouse.create(render.canvas);
    const mouseConstraint = MouseConstraint.create(engine, { mouse: mouse });
    World.add(engine.world, mouseConstraint);

    Engine.run(engine);
    Render.run(render);

    // Gentle initial drop
    setTimeout(() => {
      Body.setPosition(logoBody, { x: window.innerWidth / 2, y: 80 });
      Body.setVelocity(logoBody, { x: 0.5, y: 6 });   // slower, more natural
    }, 300);

    // Click = push from current location
    document.addEventListener('click', () => {
      Body.applyForce(logoBody, logoBody.position, {
        x: (Math.random() - 0.5) * 0.1,
        y: -0.18
      });
    });
  </script>
</body>
</html>
