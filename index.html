<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NUE - Canggu</title>
  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
  <style>
  body { 
    margin: 0; 
    background: #0A3D2B; 
    overflow: hidden; 
    font-family: system-ui, sans-serif; 
  }

  .physics-button {
    position: absolute;
    background: transparent;
    border: none;
    color: #D4A373;
    cursor: pointer;
    padding: 0;
    z-index: 100;
    transition: color 0.2s;
    font-variation-settings: "wdth" 100, "wght" 600; /* Default */
  }
  .physics-button:hover {
    color: white;
  }

  /* Unique variations */
  #btn-reserve { 
    font-size: 1.55rem; 
    font-weight: 700; 
    font-variation-settings: "wdth" 85;   /* Condensed */
  }
  #btn-menu { 
    font-size: 1.25rem; 
    font-style: italic;
    font-variation-settings: "wdth" 115;  /* Slightly expanded */
  }
  #btn-about { 
    font-size: 1.42rem; 
    font-weight: 800; 
    font-variation-settings: "wdth" 75;   /* Very condensed */
    letter-spacing: 0.06em;
  }
  #btn-contact { 
    font-size: 1.12rem; 
    font-weight: 500; 
    font-variation-settings: "wdth" 125;  /* Expanded */
  }
</style>
</head>
<body>
  <script src="script.js"></script>
</body>
</html>
