      margin: 0 auto;

      border-radius: 28px;
      overflow: hidden;
      position: relative;
    }
  </style>

  <div class="min-h-screen flex flex-col items-center justify-center p-6">
    <div class="mb-8 text-center">
      <p class="text-[#D4A373] text-xl">Modern Tropical Cuisine • Canggu, Bali</p>
    </div>

    <div id="physics-container"></div>

    <div class="flex flex-col sm:flex-row gap-4 mt-12">

        View Menu
      </a>
    </div>
  </div>

  <script>
    const Engine = Matter.Engine;
    const Render = Matter.Render;
    const World = Matter.World;
    const Bodies = Matter.Bodies;
    const Body = Matter.Body;
    const Mouse = Matter.Mouse;
    const MouseConstraint = Matter.MouseConstraint;

    const engine = Engine.create();
    engine.gravity.y = 1.65;

    const render = Render.create({
      element: document.getElementById('physics-container'),
      engine: engine,
      options: { 
        width: 760, 
        height: 420, 
        wireframes: false, 
        background: 'transparent' 
      }
    });

    // Boundaries
    World.add(engine.world, [
      Bodies.rectangle(380, 400, 1000, 60, { isStatic: true, render: { visible: false }}),
      Bodies.rectangle(-30, 210, 60, 500, { isStatic: true, render: { visible: false }}),
      Bodies.rectangle(790, 210, 60, 500, { isStatic: true, render: { visible: false }})
    ]);

    // Physics bodies (invisible - only for interaction)
    const nBody = Bodies.rectangle(210, 130, 120, 170, { restitution: 0.6, friction: 0.2, render: { visible: false } });
    const uBody = Bodies.rectangle(370, 130, 110, 170, { restitution: 0.65, friction: 0.2, render: { visible: false } });
    const eBody = Bodies.rectangle(530, 130, 120, 170, { restitution: 0.6, friction: 0.2, render: { visible: false } });

    World.add(engine.world, [nBody, uBody, eBody]);

    // Create SVG overlays - larger and better positioned
    function createLetter(body, pathData, offsetX = 0, offsetY = 0) {
      const div = document.createElement('div');
      div.style.position = 'absolute';
      div.style.width = '140px';
      div.style.height = '190px';
      div.innerHTML = `
        <svg width="140" height="190" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
          <path fill="#262626" d="${pathData}"/>
        </svg>`;
      document.getElementById('physics-container').appendChild(div);

      Matter.Events.on(engine, 'afterUpdate', () => {
        const pos = body.position;
        const angle = body.angle * (180 / Math.PI);
        div.style.left = `${pos.x - 70 + offsetX}px`;
        div.style.top = `${pos.y - 95 + offsetY}px`;
        div.style.transform = `rotate(${angle}deg)`;
      });
    }
