<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NUE - Canggu</title>
  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
  <style>
    body { margin: 0; background: #0A3D2B; overflow: hidden; font-family: system-ui, sans-serif; }
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 110px;
      background: linear-gradient(to top, #0A3D2B, rgba(10,61,43,0.95));
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 100;
      border-top: 1px solid rgba(212,163,115,0.3);
    }
    .btn {
      padding: 14px 28px;
      background: white;
      color: #0A3D2B;
      border: none;
      border-radius: 50px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover {
      background: #D4A373;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <script src="script.js"></script>

  <!-- Bottom Buttons -->
  <div class="bottom-bar">
    <button class="btn" onclick="window.open('https://octotable.com/book/restaurant/1000969/booking/new', '_blank')">Reserve a Table</button>
    <button class="btn">View Menu</button>
    <button class="btn">About NUE</button>
    <button class="btn">Contact</button>
  </div>
</body>
</html>
