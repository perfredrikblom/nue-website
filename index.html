<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NUE - Canggu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
  <style>
    body { margin: 0; background: #0A3D2B; overflow: hidden; }
  </style>
</head>
<body>

  <script>
    const Engine = Matter.Engine;
    const Render = Matter.Render;
    const World = Matter.World;
    const Bodies = Matter.Bodies;
    const Body = Matter.Body;
    const Mouse = Matter.Mouse;
    const MouseConstraint = Matter.MouseConstraint;

    const engine = Engine.create();
    engine.gravity.y = 2.6;   // stronger gravity

    const render = Render.create({
      element: document.body,
      engine: engine,
      options: {
        width: window.innerWidth,
        height: window.innerHeight,
        wireframes: false,
        background: '#0A3D2B'
      }
    });

    // Lower and more solid ground
    const ground = Bodies.rectangle(
      window.innerWidth/2, 
      window.innerHeight - 40, 
      window.innerWidth * 2, 
      100, 
      { 
        isStatic: true,
        restitution: 0.6,
        render: { visible: false }
      }
    );
    World.add(engine.world, ground);

    // Logo
    const logoBody = Bodies.rectangle(window.innerWidth/2, 120, 420, 160, {
      restitution: 0.65,     // increased bounce
      friction: 0.3,
      render: {
        sprite: {
          texture: 'nue-logo.png',
          xScale: 0.92,
          yScale: 0.92
        }
      }
    });

    World.add(engine.world, logoBody);

    // Mouse drag
    const mouse = Mouse.create(render.canvas);
    const mouseConstraint = MouseConstraint.create(engine, { mouse: mouse });
    World.add(engine.world, mouseConstraint);

    Engine.run(engine);
    Render.run(render);

    // Initial drop with extra downward velocity
    setTimeout(() => {
      Body.setVelocity(logoBody, { x: 0, y: 8 });
    }, 200);

    // Click = push from current position
    document.addEventListener('click', () => {
      Body.applyForce(logoBody, logoBody.position, {
        x: (Math.random() - 0.5) * 0.13,
        y: -0.22
      });
      Body.setAngularVelocity(logoBody, (Math.random() - 0.5) * 0.3);
    });
  </script>
</body>
</html>
