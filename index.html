<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NUE - Canggu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
  <style>
    body { margin: 0; background: #0A3D2B; overflow: hidden; }
    .debug { position: fixed; top: 10px; left: 10px; color: #D4A373; z-index: 100; font-family: monospace; }
  </style>
</head>
<body>
  <div class="debug">Debug: Trying to load nue-logo.png</div>

  <script>
    const Engine = Matter.Engine;
    const Render = Matter.Render;
    const World = Matter.World;
    const Bodies = Matter.Bodies;
    const Body = Matter.Body;
    const MouseConstraint = Matter.MouseConstraint;
    const Mouse = Matter.Mouse;

    const engine = Engine.create();
    engine.gravity.y = 1.9;

    const render = Render.create({
      element: document.body,
      engine: engine,
      options: {
        width: window.innerWidth,
        height: window.innerHeight,
        wireframes: false,
        background: '#0A3D2B'
      }
    });

    // Ground
    const ground = Bodies.rectangle(window.innerWidth/2, window.innerHeight - 50, window.innerWidth*2, 100, {
      isStatic: true,
      restitution: 0.7,
      render: { visible: false }
    });
    World.add(engine.world, ground);

    // Logo with fallback
    const logoBody = Bodies.rectangle(window.innerWidth/2, 120, 420, 160, {
      restitution: 0.65,
      friction: 0.3,
      render: {
        sprite: {
          texture: 'nue-logo.png',
          xScale: 0.9,
          yScale: 0.9
        }
      }
    });

    World.add(engine.world, logoBody);

    // Mouse drag
    const mouse = Mouse.create(render.canvas);
    const mouseConstraint = MouseConstraint.create(engine, { mouse: mouse });
    World.add(engine.world, mouseConstraint);

    Engine.run(engine);
    Render.run(render);

    // Initial drop
    setTimeout(() => {
      Body.setVelocity(logoBody, { x: 0.6, y: 8 });
    }, 300);

    console.log("✅ Physics running. If PNG doesn't show, you'll see a gray rectangle.");
  </script>
</body>
</html>
