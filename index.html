<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NUE - Canggu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
  <style>
    body { margin: 0; background: #0A3D2B; overflow: hidden; }
    .debug { position: fixed; top: 10px; left: 10px; color: white; z-index: 100; }
  </style>
</head>
<body>
  <div class="debug">Testing PNG loading...</div>

  <script>
    const Engine = Matter.Engine;
    const Render = Matter.Render;
    const World = Matter.World;
    const Bodies = Matter.Bodies;

    const engine = Engine.create();
    engine.gravity.y = 2.2;

    const render = Render.create({
      element: document.body,
      engine: engine,
      options: {
        width: window.innerWidth,
        height: window.innerHeight,
        wireframes: false,
        background: '#0A3D2B'
      }
    });

    // Ground
    const ground = Bodies.rectangle(window.innerWidth/2, window.innerHeight - 80, window.innerWidth*2, 160, {
      isStatic: true,
      render: { visible: false }
    });
    World.add(engine.world, ground);

    // Test with one logo
    const logoBody = Bodies.rectangle(window.innerWidth/2, 150, 400, 160, {
      restitution: 0.5,
      render: {
        sprite: {
          texture: 'nue-logo.png',   // Make sure this name is exact
          xScale: 0.9,
          yScale: 0.9
        }
      }
    });

    World.add(engine.world, logoBody);

    Engine.run(engine);
    Render.run(render);

    console.log("✅ Physics running. Check if nue-logo.png loads.");
  </script>
</body>
</html>
