<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NUE - Canggu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; }
    #physics-container { 
      width: 100%; 
      max-width: 720px; 
      height: 380px; 
      margin: 0 auto; 
      background: rgba(10, 61, 43, 0.6); 
      border-radius: 24px;
      border: 1px solid rgba(212, 163, 115, 0.2);
      overflow: hidden;
    }
  </style>
</head>
<body class="bg-[#0A3D2B] text-white min-h-screen">

  <div class="min-h-screen flex flex-col items-center justify-center p-6">
    
    <div class="mb-8 text-center">
      <p class="text-[#D4A373] text-xl mb-2">Modern Tropical Cuisine • Canggu, Bali</p>
    </div>

    <!-- Interactive Logo Container -->
    <div id="physics-container"></div>

    <div class="flex flex-col sm:flex-row gap-4 mt-12">
      <a href="https://octotable.com/book/restaurant/1000969/booking/new" 
         target="_blank"
         class="bg-white text-black px-10 py-4 rounded-full text-lg font-medium hover:bg-[#D4A373] transition-all">
        Reserve a Table
      </a>
      <a href="#menu" class="border border-white/70 hover:border-white px-10 py-4 rounded-full text-lg font-medium transition-all">
        View Menu
      </a>
    </div>
  </div>

  <script>
    const Engine = Matter.Engine;
    const Render = Matter.Render;
    const World = Matter.World;
    const Bodies = Matter.Bodies;
    const Body = Matter.Body;
    const Mouse = Matter.Mouse;
    const MouseConstraint = Matter.MouseConstraint;

    const engine = Engine.create();
    engine.gravity.y = 1.6;

    const render = Render.create({
      element: document.getElementById('physics-container'),
      engine: engine,
      options: {
        width: 720,
        height: 380,
        wireframes: false,
        background: 'transparent'
      }
    });

    // Boundaries
    const ground = Bodies.rectangle(360, 355, 900, 60, { isStatic: true, render: { fillStyle: 'transparent' }});
    const leftWall = Bodies.rectangle(-20, 190, 60, 500, { isStatic: true, render: { visible: false }});
    const rightWall = Bodies.rectangle(740, 190, 60, 500, { isStatic: true, render: { visible: false }});

    World.add(engine.world, [ground, leftWall, rightWall]);

    // Create 3 separate bodies for N, U, E using your logo colors
    const n = Bodies.rectangle(190, 100, 95, 170, {
      restitution: 0.6,
      friction: 0.2,
      chamfer: { radius: 15 },
      render: { fillStyle: '#262626' }
    });

    const u = Bodies.rectangle(340, 100, 90, 170, {
      restitution: 0.65,
      friction: 0.2,
      chamfer: { radius: 15 },
      render: { fillStyle: '#262626' }
    });

    const e = Bodies.rectangle(490, 100, 95, 170, {
      restitution: 0.6,
      friction: 0.2,
      chamfer: { radius: 15 },
      render: { fillStyle: '#262626' }
    });

    World.add(engine.world, [n, u, e]);

    // Mouse drag support
    const mouse = Mouse.create(render.canvas);
    const mouseConstraint = MouseConstraint.create(engine, {
      mouse: mouse,
      constraint: { stiffness: 0.9 }
    });
    World.add(engine.world, mouseConstraint);

    Engine.run(engine);
    Render.run(render);

    // Double-click to drop again
    render.canvas.addEventListener('dblclick', () => {
      [n, u, e].forEach(body => {
        Body.setPosition(body, { x: 150 + Math.random() * 420, y: 50 });
        Body.setVelocity(body, { x: (Math.random() - 0.5) * 12, y: -16 });
      });
    });

    console.log("✅ Using your logo colors + softer shapes");
  </script>
</body>
</html>
