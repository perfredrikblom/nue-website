<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NUE - Canggu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
  <style>
    body { margin: 0; background: #0A3D2B; overflow: hidden; }
  </style>
</head>
<body>

  <script>
    let engine, render, logoBody, ground;

    function initPhysics() {
      if (render) Render.stop(render);
      if (engine) Engine.clear(engine);

      engine = Engine.create();
      engine.gravity.y = 1.85;           // Natural feel

      render = Render.create({
        element: document.body,
        engine: engine,
        options: {
          width: window.innerWidth,
          height: window.innerHeight,
          wireframes: false,
          background: '#0A3D2B'
        }
      });

      // Ground - follows window bottom
      ground = Bodies.rectangle(
        window.innerWidth / 2, 
        window.innerHeight - 40, 
        window.innerWidth * 2, 
        100, 
        { 
          isStatic: true,
          restitution: 0.68,
          render: { visible: false }
        }
      );

      World.add(engine.world, ground);

      // Logo
      logoBody = Bodies.rectangle(window.innerWidth / 2, 120, 420, 160, {
        restitution: 0.65,
        friction: 0.28,
        render: {
          sprite: {
            texture: 'nue-logo.png',
            xScale: 0.9,
            yScale: 0.9
          }
        }
      });

      World.add(engine.world, logoBody);

      // Mouse drag
      const mouse = Mouse.create(render.canvas);
      const mouseConstraint = MouseConstraint.create(engine, { mouse: mouse });
      World.add(engine.world, mouseConstraint);

      Engine.run(engine);
      Render.run(render);
    }

    // Initial setup
    initPhysics();

    // Gentle initial drop
    setTimeout(() => {
      if (logoBody) {
        Body.setVelocity(logoBody, { x: 0.8, y: 7 });
        Body.setAngularVelocity(logoBody, 0.15);   // slight natural rotation
      }
    }, 400);

    // Click to push
    document.addEventListener('click', () => {
      if (logoBody) {
        Body.applyForce(logoBody, logoBody.position, {
          x: (Math.random() - 0.5) * 0.12,
          y: -0.19
        });
        Body.setAngularVelocity(logoBody, (Math.random() - 0.5) * 0.4);
      }
    });

    // Handle window resize
    window.addEventListener('resize', () => {
      initPhysics();
    });
  </script>
</body>
</html>
